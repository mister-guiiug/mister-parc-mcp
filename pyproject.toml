[project]
name = "mister-parc-mcp"
version = "0.2.0"
description = "Serveur MCP en lecture seule sur l'état du parc mister-guiiug : tableau de bord et socle."
readme = "README.md"
license = "MIT"
requires-python = ">=3.15.2"
dependencies = [
    "fastmcp>=4.2.4",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
