[project]
name = "mister-parc-mcp"
version = "0.1.0"
description = "Serveur MCP en lecture seule sur l'état du parc mister-guiiug : tableau de bord et socle."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
